name: Pages

# Every push and pull request is typechecked, tested and built; a push to main is published to
# GitHub Pages (https://usace-wrises.github.io/ceica/). One-time setup: Settings > Pages > Build and
# deployment > Source: "GitHub Actions".
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          # every commit, for the repository's rules (web/tests/repo_rules.test.ts)
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm --prefix web ci

      - name: Typecheck
        run: npm --prefix web run typecheck

      - name: Test
        run: npm --prefix web test

      - name: Build
        run: npm --prefix web run build

      - name: The build
        # its id and every file's sha256, to compare with a build of the same commit made elsewhere
        run: |
          grep -o 'const BUILD = "[0-9a-f]*"' web/dist/app-sw.js
          cd web/dist && find . -type f | sort | xargs sha256sum

      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
